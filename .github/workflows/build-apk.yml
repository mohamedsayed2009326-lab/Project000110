name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          if [ -d android ]; then
            mkdir project && cp -r android project/android
          else
            ZIP=$(ls *.zip 2>/dev/null | head -1)
            if [ -z "$ZIP" ]; then
              echo "No zip and no android folder found:"
              ls -la
              exit 1
            fi
            unzip -q "$ZIP" -d project
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        working-directory: project/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp project/android/app/build/outputs/apk/debug/app-debug.apk AbouSabraGate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: abousabra-gate-debug-apk
          path: AbouSabraGate.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: AbouSabraGate.apk
